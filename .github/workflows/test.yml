name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # ./... stops at the module boundary even inside a workspace, so the tools
      # module has to be named. It is a separate module so that the library's
      # go.mod can require nothing; leaving it out of CI is how that would rot.
      - run: go build ./... ./tools/...
      - run: go vet ./... ./tools/...
      - run: go test -race ./... ./tools/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd: $unformatted"
            exit 1
          fi
